openapi: 3.0.3
info:
  title: Lost & Found API - Search & Exploration Module
  description: |
    API documentation for Binôme 2: Search & Exploration.
    Handles multi-criteria filtering, full-text queries, bounding-box geolocation,
    sorting, and scalable pagination for lost and found posts.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Local development server

paths:
  /posts/search/autocomplete:
    get:
      summary: Real-time search autocomplete
      description: |
        Returns fast instant suggestions across post titles, categories, and mall places/zones
        as the user types.
      tags:
        - Search & Exploration
      parameters:
        - name: q
          in: query
          description: Search prefix or query string.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
          example: "tél"
        - name: intent
          in: query
          description: Filter post suggestions by intent.
          required: false
          schema:
            type: string
            enum: [lost, found]
          example: "lost"
        - name: limit
          in: query
          description: Maximum number of suggestions per category.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
          example: 5
      responses:
        "200":
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  suggestions:
                    type: object
                    properties:
                      posts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            intent:
                              type: string
                            category:
                              type: string
                            place:
                              type: string
                      categories:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                      places:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            zone:
                              type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/search:
    get:
      summary: Search and explore posts
      description: |
        Retrieves active posts matching multiple optional criteria.
        Returns recommendations/suggestions if no posts match.
      tags:
        - Search & Exploration
      parameters:
        - name: q
          in: query
          description: Full-text search keyword across post title and description.
          required: false
          schema:
            type: string
            maxLength: 200
          example: "téléphone noir"

        - name: intent
          in: query
          description: Filter by post intent.
          required: false
          schema:
            type: string
            enum: [lost, found]
          example: "lost"

        - name: category
          in: query
          description: Category name (case-insensitive match).
          required: false
          schema:
            type: string
            maxLength: 50
          example: "téléphone"

        - name: zone
          in: query
          description: Mall zone name (case-insensitive match).
          required: false
          schema:
            type: string
            maxLength: 100
          example: "Food Court"

        - name: lat
          in: query
          description: Center latitude for bounding-box radius search (-90 to 90). Must be paired with `lng`.
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 36.8065

        - name: lng
          in: query
          description: Center longitude for bounding-box radius search (-180 to 180). Must be paired with `lat`.
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 10.1815

        - name: radius
          in: query
          description: Search radius in kilometers.
          required: false
          schema:
            type: number
            minimum: 0.1
            maximum: 100
            default: 5
          example: 2

        - name: from
          in: query
          description: Start of the date filter window (ISO 8601).
          required: false
          schema:
            type: string
            format: date-time
          example: "2026-11-01T00:00:00Z"

        - name: to
          in: query
          description: End of the date filter window (ISO 8601). Must be >= `from`.
          required: false
          schema:
            type: string
            format: date-time
          example: "2026-11-17T23:59:59Z"

        - name: status
          in: query
          description: Filter by post status. Defaults to active.
          required: false
          schema:
            type: string
            enum: [active, resolved, expired]
            default: active
          example: "active"

        - name: sort
          in: query
          description: Sort ordering for results.
          required: false
          schema:
            type: string
            enum: [recent, oldest, relevance]
            default: recent
          example: "recent"

        - name: page
          in: query
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: limit
          in: query
          description: Maximum number of items per page (capped at 50 for performance).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 10

      responses:
        "200":
          description: Search completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                successWithResults:
                  summary: Matching posts found
                  value:
                    data:
                      - _id: "673a388f63bbd067cba12345"
                        intent: "lost"
                        category: "téléphone"
                        title: "Téléphone perdu"
                        description: "Objet perdu près de Bibliothèque."
                        lat: 36.8065
                        lng: 10.1815
                        start: "2026-11-10T14:30:00.000Z"
                        end: "2026-11-10T16:00:00.000Z"
                        status: "active"
                        user: "673a388f63bbd067cba54321"
                        created_at: "2026-11-10T16:05:00.000Z"
                        updated_at: "2026-11-10T16:05:00.000Z"
                    pagination:
                      page: 1
                      limit: 10
                      total: 1
                      totalPages: 1
                      hasNextPage: false
                      hasPrevPage: false
                    suggestions: []
                noResultsWithSuggestions:
                  summary: No posts found - suggestions provided
                  value:
                    data: []
                    pagination:
                      page: 1
                      limit: 10
                      total: 0
                      totalPages: 1
                      hasNextPage: false
                      hasPrevPage: false
                    suggestions:
                      - "Essayez sans filtre de catégorie."
                      - "Élargissez la plage de dates."
                      - "Augmentez le rayon de recherche (actuellement 2 km)."

        "422":
          description: Validation error on query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: "VALIDATION_ERROR"
                  message: "One or more fields are invalid."
                  correlation_id: null
                  retryable: false
                  details:
                    limit:
                      - code: "TOO_LARGE"
                        params:
                          limit: 50

components:
  schemas:
    Post:
      type: object
      properties:
        _id:
          type: string
        intent:
          type: string
          enum: [lost, found]
        category:
          type: string
        zone:
          type: string
          nullable: true
          example: "Food Court"
        title:
          type: string
        description:
          type: string
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        distance_km:
          type: number
          description: Included when lat/lng query is supplied.
        start:
          type: string
          format: date-time
          nullable: true
        end:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, resolved, expired]
        user:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean

    SearchResponse:
      type: object
      required:
        - data
        - pagination
        - suggestions
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        pagination:
          $ref: "#/components/schemas/Pagination"
        suggestions:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
              nullable: true
            retryable:
              type: boolean
            details:
              type: object
